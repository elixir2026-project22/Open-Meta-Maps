<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Open Meta Maps workflow</title>
  <desc>A genome-scale model is matched against the Atlas of expert pathway layouts; the Layout Composer keeps the matched expert structures as a skeleton and lays out the remaining reactions algorithmically; the result is a complete map with provenance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
  </defs>
  <rect width="960" height="330" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <!-- input -->
  <rect x="24" y="96" width="150" height="104" rx="10" fill="#eef3f8" stroke="#6b7f95" stroke-width="1.5"/>
  <text x="99" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Input model</text>
  <text x="99" y="156" text-anchor="middle" font-size="13" fill="#374151">genome-scale</text>
  <text x="99" y="174" text-anchor="middle" font-size="13" fill="#374151">metabolic model</text>
  <text x="99" y="192" text-anchor="middle" font-size="12" fill="#6b7280">SBML · COBRA JSON</text>
  <!-- atlas -->
  <rect x="222" y="28" width="250" height="92" rx="10" fill="#e7f4ee" stroke="#3f8f6b" stroke-width="1.5"/>
  <text x="347" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Atlas</text>
  <text x="347" y="77" text-anchor="middle" font-size="13" fill="#374151">expert-drawn pathway structures</text>
  <text x="347" y="95" text-anchor="middle" font-size="12" fill="#6b7280">Escher · WikiPathways · Reactome</text>
  <text x="347" y="111" text-anchor="middle" font-size="12" fill="#6b7280">identity · topology · geometry · licence</text>
  <!-- composer container -->
  <rect x="222" y="148" width="500" height="158" rx="10" fill="#fbf6ea" stroke="#b9852f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="236" y="170" font-size="14" font-weight="700" fill="#1f2937">Layout Composer</text>
  <rect x="240" y="186" width="210" height="104" rx="8" fill="#ffffff" stroke="#3f8f6b" stroke-width="1.5"/>
  <text x="345" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">1  Expert skeleton</text>
  <text x="345" y="231" text-anchor="middle" font-size="12" fill="#374151">match reactions to Atlas structures</text>
  <text x="345" y="248" text-anchor="middle" font-size="12" fill="#374151">select non-overlapping structures</text>
  <text x="345" y="268" text-anchor="middle" font-size="11" fill="#6b7280">expert geometry kept as drawn</text>
  <rect x="490" y="186" width="214" height="104" rx="8" fill="#ffffff" stroke="#b9852f" stroke-width="1.5"/>
  <text x="597" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">2  Algorithmic completion</text>
  <text x="597" y="231" text-anchor="middle" font-size="12" fill="#374151">place the remaining reactions</text>
  <text x="597" y="248" text-anchor="middle" font-size="12" fill="#374151">curved connections · labels</text>
  <text x="597" y="268" text-anchor="middle" font-size="11" fill="#6b7280">every GEM reaction is drawn</text>
  <!-- output -->
  <rect x="770" y="96" width="166" height="104" rx="10" fill="#eef3f8" stroke="#6b7f95" stroke-width="1.5"/>
  <text x="853" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Complete map</text>
  <text x="853" y="152" text-anchor="middle" font-size="13" fill="#374151">Escher JSON · SVG</text>
  <text x="853" y="171" text-anchor="middle" font-size="12" fill="#374151">provenance per reaction</text>
  <text x="853" y="189" text-anchor="middle" font-size="12" fill="#6b7280">layout quality report</text>
  <!-- arrows -->
  <path d="M174,148 L214,100 L222,96" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)" display="none"/>
  <path d="M174,134 C198,134 198,238 238,238" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M347,120 L347,184" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="357" y="138" font-size="11" fill="#4b5563">structure retrieval</text>
  <path d="M450,238 L488,238" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M722,226 C746,226 746,170 768,170" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
