<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="640" height="200" fill="#fff"/>
<text x="20" y="28" font-size="13" font-weight="700" fill="#1f2937">Compact selection among overlapping candidates</text>
<rect x="40" y="50" width="200" height="100" rx="8" fill="#f5f5f5" stroke="#9ca3af" stroke-width="1.2"/>
<text x="140" y="78" text-anchor="middle" font-size="12" fill="#6b7280">Sprawling whole-map window</text>
<text x="140" y="98" text-anchor="middle" font-size="11" fill="#9ca3af">same reaction set</text>
<text x="140" y="128" text-anchor="middle" font-size="11" fill="#9ca3af">lower density → dropped</text>
<text x="280" y="105" text-anchor="middle" font-size="20" fill="#6b7280">→</text>
<rect x="320" y="50" width="200" height="100" rx="8" fill="#e7f4ee" stroke="#3f8f6b" stroke-width="1.6"/>
<text x="420" y="78" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">Compact pathway window</text>
<text x="420" y="98" text-anchor="middle" font-size="11" fill="#3f8f6b">same reaction set</text>
<text x="420" y="128" text-anchor="middle" font-size="11" fill="#3f8f6b">higher density → kept</text>
<text x="20" y="182" font-size="11" fill="#6b7280">Coverage still ranks first; compactness breaks ties for same-source biochemical matches with identical reaction sets.</text>
</svg>